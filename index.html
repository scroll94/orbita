document.querySelectorAll('#t1 .card').forEach((c,i)=>c.classList.toggle('on',i==k));p.a.material.color.set(p.c[2]);
if(k<0){fx=null;FP.visible=false;return}
const f=FX[p.e[k][3]];fx={k,f,u:[],r:[]};
for(let i=0;i<f.n;i++){const a=Math.random()*6.283,y=f.aur?(Math.random()<.5?1:-1)*(.75+Math.random()*.2):Math.random()*2-1,q=Math.sqrt(1-y*y);fx.u.push(q*Math.cos(a),y,q*Math.sin(a));fx.r.push(p.r*(1.03+Math.random()*.7))}
FP.material.color.set(f.c);fg.setDrawRange(0,f.n);p.g.add(FP);FP.visible=true;p.a.material.color.set(f.c)}
function selPlace(j){sel=j;document.querySelectorAll('#t2 .card').forEach((c,i)=>c.classList.toggle('on',i==j));tab(2)}
function fill(i){const p=P[i];
$('#pb').innerHTML=[['Опасность',p.h[0],'#fb923c,#ff3ca8'],['Обитаемость',p.h[1],'#8b5cf6,#34d399']].map(b=>`<div class="bar">${b[0]} · ${b[1]}%<i><b style="width:${b[1]}%;background:linear-gradient(90deg,${b[2]})"></b></i></div>`).join('');
$('#t1').innerHTML=p.e.map(x=>`<div class="card"><h4>${x[0]} ${x[1]}</h4><div>${x[2]}</div><small>● НАБЛЮДАЕТСЯ СЕЙЧАС</small></div>`).join('');
$('#t2').innerHTML=p.pl.map(x=>`<div class="card"><h4>📍 ${x[0]}</h4><div>${x[1]}</div></div>`).join('');
document.querySelectorAll('#t1 .card').forEach((c,k)=>c.onclick=()=>setFx(k));
document.querySelectorAll('#t2 .card').forEach((c,j)=>c.onclick=()=>selPlace(j));
tab(0);setFx(0)}
function FXU(dt,now){P.forEach((p,i)=>p.ps.forEach((s,j)=>{s.visible=i==foc;if(i==foc)s.scale.setScalar(d*(j==sel?.12*(1+Math.sin(now*.008)*.15):.06))}));
if(foc<0)return;const p=P[foc];
if(sel>=0){p.ps[sel].getWorldPosition(V);const df=((Math.atan2(cam.position.x-gT.x,cam.position.z-gT.z)-Math.atan2(V.x-gT.x,V.z-gT.z)+9.4248)%6.2832)-3.1416;p.m.rotation.y+=df*Math.min(1,dt*2.5)}
if(!fx){p.a.material.opacity=.2;return}
const f=fx.f,a=fg.attributes.position.array,st=f.dir*f.sp*dt*p.r*.4,lo=p.r*1.03,hi=p.r*1.75;
for(let i=0;i<f.n;i++){let r=fx.r[i]+=st;if(r>hi)r=fx.r[i]=lo;else if(r<lo)r=fx.r[i]=hi;a[i*3]=fx.u[i*3]*r;a[i*3+1]=fx.u[i*3+1]*r;a[i*3+2]=fx.u[i*3+2]*r}
fg.attributes.position.needsUpdate=true;FP.rotation.y+=dt*(f.spin||0);
if(f.fl){if(Math.random()<dt*1.6)flash=1;flash*=Math.exp(-dt*7);p.a.material.opacity=.2+flash*.6}else p.a.material.opacity=.2}
function pickPlace(e){if(foc<0)return -1;const p=P[foc];RC.setFromCamera({x:e.clientX/innerWidth*2-1,y:-e.clientY/innerHeight*2+1},cam);
const h=RC.intersectObjects(p.ps).filter(x=>{x.object.getWorldPosition(V);return V.sub(gT).dot(W.copy(cam.position).sub(gT))>0});return h.length?h[0].object.userData.j:-1}
const mk=[],nav=$('#nav'),lbs=$('#labels');
P.forEach((p,i)=>{const g=new THREE.Group();g.position.set(Math.cos(p.o[1])*p.o[0],p.o[2],Math.sin(p.o[1])*p.o[0]);
p.m=new THREE.Mesh(new THREE.SphereGeometry(p.r,48,32),new THREE.MeshStandardMaterial({map:ptex(p.c),roughness:.8,emissive:new THREE.Color(p.c[0]),emissiveIntensity:.18}));
p.a=new THREE.Mesh(new THREE.SphereGeometry(p.r*1.13,32,24),new THREE.MeshBasicMaterial({color:p.c[2],transparent:true,opacity:.2,side:THREE.BackSide,blending:AD,depthWrite:false}));g.add(p.m,p.a);
p.ps=p.pl.map((q,j)=>{const la=q[2]*Math.PI/180,lo=q[3]*Math.PI/180,sp=new THREE.Sprite(new THREE.SpriteMaterial({map:HM,blending:AD,transparent:true,depthWrite:false}));
sp.position.set(Math.cos(la)*Math.cos(lo),Math.sin(la),Math.cos(la)*Math.sin(lo)).multiplyScalar(p.r*1.04);sp.userData.j=j;sp.visible=false;p.m.add(sp);return sp});
if(p.ring){const rg=new THREE.Mesh(new THREE.RingGeometry(p.r*1.5,p.r*2.4,96),new THREE.MeshBasicMaterial({color:p.c[1],side:2,transparent:true,opacity:.45,depthWrite:false}));rg.rotation.x=1.3;rg.rotation.y=.3;g.add(rg)}
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:mark(p.rgb),blending:AD,transparent:true,depthTest:false}));s.userData.i=i;g.add(s);mk.push(s);p.g=g;p.s=s;G.add(g);
p.l=document.createElement('div');p.l.className='lb';p.l.textContent=p.n;lbs.appendChild(p.l);
p.b=document.createElement('button');p.b.textContent=p.n;p.b.onclick=()=>focus(i);nav.appendChild(p.b)});

// Камера
const T=new THREE.Vector3(),gT=new THREE.Vector3(),W=new THREE.Vector3(),V=new THREE.Vector3();
let th=.8,ph=1.15,d=150,gd=52,foc=-1,hov=-1,t0=performance.now();const keys={};
function focus(i){if(foc>=0)P[foc].a.material.color.set(P[foc].c[2]);fx=null;sel=-1;foc=i;gd=P[i].r*4.8;document.body.classList.add('f');
$('#pn').textContent=P[i].n;$('#pt').textContent=P[i].t;$('#pd').textContent=P[i].d;
$('#pr').innerHTML=P[i].i.map(r=>`<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
P.forEach((p,j)=>p.b.classList.toggle('on',j==i));fill(i)}
function out(){if(foc>=0){P[foc].a.material.color.set(P[foc].c[2]);P[foc].a.material.opacity=.2}fx=null;FP.visible=false;sel=-1;foc=-1;gd=52;gT.set(0,0,0);document.body.classList.remove('f');P.forEach(p=>p.b.classList.remove('on'))}
$('#back').onclick=out;addEventListener('keydown',e=>{if(e.key=='Escape')out();keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);

// Ввод
const ptrs=new Map(),RC=new THREE.Raycaster();let moved=0,pd=0;
const pinch=()=>{const a=[...ptrs.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
function pick(e){RC.setFromCamera({x:e.clientX/innerWidth*2-1,y:-e.clientY/innerHeight*2+1},cam);const h=RC.intersectObjects(mk.filter(s=>s.visible));return h.length?h[0].object.userData.i:-1}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;pd=pinch()});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);
if(!p){hov=pick(e);cv.style.cursor=(hov>=0||pickPlace(e)>=0)?'pointer':'grab';return}
const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
if(ptrs.size==2){const n=pinch();if(pd)gd=clamp(gd*pd/n,foc>=0?P[foc].r*2.2:4,140);pd=n;moved+=9;return}
moved+=Math.abs(dx)+Math.abs(dy);
if((e.buttons&2||e.shiftKey)&&foc<0){V.setFromMatrixColumn(cam.matrix,0);gT.addScaledVector(V,-dx*d*.0016);V.setFromMatrixColumn(cam.matrix,1);gT.addScaledVector(V,dy*d*.0016)}
else{th-=dx*.006;ph=clamp(ph-dy*.006,.08,3.06)}});
cv.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);if(moved<6&&!ptrs.size){const q=pickPlace(e);if(q>=0){selPlace(q);return}const i=pick(e);if(i>=0)focus(i)}});
cv.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();gd=clamp(gd*Math.exp(e.deltaY*.0012),foc>=0?P[foc].r*2.2:4,140)},{passive:false});
function size(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();

// Цикл
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-t0)/1000,.05);t0=now;
G.rotation.y+=dt*.012;P.forEach((p,i)=>p.m.rotation.y+=dt*(i==foc?(sel>=0?0:.06):.25));S.updateMatrixWorld();
if(foc>=0)P[foc].g.getWorldPosition(gT);
else{if(!ptrs.size)th+=dt*.03;const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),r=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
if(f||r){V.set(T.x-cam.position.x,0,T.z-cam.position.z).normalize();gT.addScaledVector(V,f*d*.7*dt);gT.x+=-V.z*r*d*.7*dt*-1;gT.z+=V.x*r*d*.7*dt*-1}}
const k=1-Math.exp(-dt*3);T.lerp(gT,k);d+=(gd-d)*k;
cam.position.set(T.x+d*Math.sin(ph)*Math.cos(th),T.y+d*Math.cos(ph),T.z+d*Math.sin(ph)*Math.sin(th));cam.lookAt(T);
const pulse=1+Math.sin(now*.003)*.12;
P.forEach((p,i)=>{p.g.getWorldPosition(W);const dist=W.distanceTo(cam.position),show=foc<0&&dist>p.r*5;
p.s.visible=show;p.s.scale.setScalar(dist*(i==hov?.095:.07)*pulse);
V.copy(W).project(cam);const vis=show&&V.z<1;p.l.style.display=vis?'block':'none';
if(vis){p.l.style.transform=`translate(${(V.x*.5+.5)*innerWidth}px,${(-V.y*.5+.5)*innerHeight}px) translateX(-50%)`;p.l.classList.toggle('h',i==hov)}});
FXU(dt,now);core.material.opacity=.7+Math.sin(now*.0015)*.1;R.render(S,cam)}
requestAnimationFrame(loop);
</script>
